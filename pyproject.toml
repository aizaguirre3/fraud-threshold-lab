[project]
name = "fraud-threshold-lab"
version = "0.1.0"
description = "Fraud detection threshold, cost, calibration, and false-positive analysis harness"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "matplotlib==3.9.2",
    "pyarrow==18.1.0",
    "scipy==1.14.1",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    # Executes sql/threshold_sweep.sql so the SQL implementation is verified
    # against the Python one in CI.
    "duckdb==1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
