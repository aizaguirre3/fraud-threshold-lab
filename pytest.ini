[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # Apple's Accelerate BLAS raises spurious FPU flags from matmul on macOS/arm64
    # even for finite, well-scaled inputs. Verified with a plain numpy A @ A.T on
    # random normal data with no scikit-learn involved. Narrowly scoped to matmul
    # so a genuine overflow elsewhere still surfaces.
    ignore:divide by zero encountered in matmul:RuntimeWarning
    ignore:overflow encountered in matmul:RuntimeWarning
    ignore:invalid value encountered in matmul:RuntimeWarning
