name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      # The Kaggle data is not redistributable and is not in the repo. The test
      # suite runs entirely on synthetic fixtures for exactly this reason: the
      # metric, threshold, cost, and leakage logic is what needs guarding, and
      # none of it requires the real dataset.
      - name: Run tests
        run: pytest -q
